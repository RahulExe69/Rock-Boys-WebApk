name: Build and Release WebApk

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '.versions/version.json'
      - '.build-outputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Auto-Update Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Verify Build Outputs
        run: |
          if [ -f ".build-outputs/app-release.apk" ]; then
            echo "Successfully verified APK generation at .build-outputs/app-release.apk"
            ls -lh .build-outputs/app-release.apk
          else
            echo "::error::Release APK not found in .build-outputs/ directory!"
            exit 1
          fi

      - name: Auto-Synchronize Version JSON
        shell: python
        run: |
          import re
          import json
          import subprocess
          import os

          # 1. Read app/build.gradle.kts
          gradle_path = 'app/build.gradle.kts'
          if not os.path.exists(gradle_path):
              print(f"Error: Gradle file not found at {gradle_path}")
              exit(1)

          with open(gradle_path, 'r', encoding='utf-8') as f:
              gradle_content = f.read()

          # Locate versionCode and versionName
          version_code_match = re.search(r'versionCode\s*=\s*([0-9]+)', gradle_content)
          version_name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_content)

          if not version_code_match or not version_name_match:
              print("Error: Could not extract versionCode or versionName from build.gradle.kts")
              exit(1)

          version_code = int(version_code_match.group(1))
          version_name = version_name_match.group(1)
          print(f"Extracted values from build.gradle.kts -> Code: {version_code}, Name: {version_name}")

          # 2. Read existing version.json or create if missing
          version_json_path = '.versions/version.json'
          data = {}
          if os.path.exists(version_json_path):
              with open(version_json_path, 'r', encoding='utf-8') as f:
                  try:
                      data = json.load(f)
                  except Exception as e:
                      print(f"Warning: Failed to load existing version.json: {e}")
          
          # 3. Pull the latest git commit message for the release changeLog
          try:
              commit_msg = subprocess.check_output(['git', 'log', '-1', '--pretty=%B']).decode('utf-8').strip()
              # Filter out auto-commit messages to keep historical changelogs useful
              if "Automated build & release" in commit_msg or "[skip ci]" in commit_msg:
                  # Pull the second latest commit message
                  commit_msg = subprocess.check_output(['git', 'log', '-2', '--pretty=%B']).decode('utf-8').split('\n\n')[1].strip()
          except Exception as e:
              print(f"Warning: Failed to extract git commit message: {e}")
              commit_msg = "Performance optimizations and native compatibility enhancements."

          # Truncate or use fallback if empty
          if not commit_msg or len(commit_msg) < 5:
              commit_msg = "Updates, performance improvements, and bug fixes."

          # 4. Update the JSON fields
          data['versionCode'] = version_code
          data['versionName'] = version_name
          data['changeLog'] = commit_msg
          data['apkUrl'] = "https://github.com/RahulExe69/Rock-Boys-WebApk/raw/refs/heads/main/.build-outputs/app-release.apk"
          if 'forceUpdate' not in data:
              data['forceUpdate'] = True

          # 5. Format and write out
          os.makedirs(os.path.dirname(version_json_path), exist_ok=True)
          with open(version_json_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(f"Successfully synchronized {version_json_path} to version {version_name} ({version_code})")

      - name: Commit and Push Release Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .versions/version.json .build-outputs/app-release.apk
          
          # Check if there are changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No build or version metadata updates to commit."
          else
            git commit -m "Automated build & release: update APK and version.json to v$(python -c "import json; print(json.load(open('.versions/version.json'))['versionName'])") [skip ci]"
            git push origin main
          fi
