name: Build and Release WebApk

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '.versions/version.json'
      - '.build-outputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Auto-Update Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle & Dependency Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-overwrite-existing: true
          validate-wrappers: false

      - name: Setup Keystore
        run: |
          python3 - << EOF
          import base64
          b64 = """"""
          with open("debug.keystore", "wb") as f:
              f.write(base64.b64decode(b64.strip()))
          print("Successfully restored official debug.keystore")
          EOF
          echo "Verifying official debug.keystore cryptographic signature..."
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey
          echo "Successfully verified permanent debug.keystore readiness."

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: gradle :app:assembleRelease -x test --build-cache --parallel

      - name: Verify Build Outputs
        run: |
          if [ -f ".build-outputs/app-release.apk" ]; then
            echo "Successfully verified APK generation at .build-outputs/app-release.apk"
            ls -lh .build-outputs/app-release.apk
          else
            echo "::error::Release APK not found in .build-outputs/ directory!"
            exit 1
          fi

      - name: Publish High-Speed GitHub Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          TAG="v${VERSION_NAME}"
          echo "Publishing automated GitHub Release for $TAG..."

          # Remove existing release/tag with same name if workflow was re-run
          gh release delete "$TAG" --yes --cleanup-tag || true

          # Create release and upload APK as primary asset with latest tag
          gh release create "$TAG" .build-outputs/app-release.apk \
            --title "Rock Boys App v${VERSION_NAME}" \
            --notes "Rock Boys update v${VERSION_NAME}. High-speed direct downloads and performance enhancements." \
            --latest
