name: Build and Release WebApk

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '.versions/version.json'
      - '.build-outputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Auto-Update Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Setup Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            python3 -c '
          import base64
          with open("debug.keystore.base64", "rb") as f:
              data = f.read().replace(b"\n", b"").replace(b"\r", b"").replace(b" ", b"")
              with open("debug.keystore", "wb") as out:
                  out.write(base64.b64decode(data))
          ' || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fresh standard Android debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Successfully verified debug.keystore readiness."

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: gradle :app:assembleRelease -x test --build-cache --parallel

      - name: Verify Build Outputs
        run: |
          if [ -f ".build-outputs/app-release.apk" ]; then
            echo "Successfully verified APK generation at .build-outputs/app-release.apk"
            ls -lh .build-outputs/app-release.apk
          else
            echo "::error::Release APK not found in .build-outputs/ directory!"
            exit 1
          fi

      - name: Publish High-Speed GitHub Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          TAG="v${VERSION_NAME}"
          echo "Publishing automated GitHub Release for $TAG..."

          # Remove existing release/tag with same name if workflow was re-run
          gh release delete "$TAG" --yes --cleanup-tag || true

          # Create release and upload APK as primary asset with latest tag
          gh release create "$TAG" .build-outputs/app-release.apk \
            --title "Rock Boys App v${VERSION_NAME}" \
            --notes "Rock Boys update v${VERSION_NAME}. High-speed direct downloads and performance enhancements." \
            --latest

      - name: Synchronize Legacy Version Files
        run: |
          python3 - << 'EOF'
          import json, os, subprocess, re

          with open('app/build.gradle.kts', 'r') as f:
              gradle_txt = f.read()

          v_code_match = re.search(r'versionCode\s*=\s*(\d+)', gradle_txt)
          v_name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_txt)

          version_code = int(v_code_match.group(1)) if v_code_match else 1
          version_name = v_name_match.group(1) if v_name_match else "1.0.0"

          try:
              commit_msg = subprocess.check_output(['git', 'log', '-1', '--pretty=%B']).decode('utf-8').strip()
              tech_terms = ['ci', 'workflow', 'action', 'keystore', 'base64', 'gradle', 'build', 'commit', 'git', 'agent', 'keepversion', 'merge']
              if any(term in commit_msg.lower() for term in tech_terms) or len(commit_msg) < 5:
                  commit_msg = "Faster in-app downloads with instant connection, smoother performance, and stability enhancements."
          except Exception:
              commit_msg = "Faster in-app downloads with instant connection, smoother performance, and stability enhancements."

          data = {
              "versionCode": version_code,
              "versionName": version_name,
              "changeLog": commit_msg,
              "apkUrl": f"https://github.com/RahulExe69/Rock-Boys-WebApk/releases/download/v{version_name}/app-release.apk",
              "forceUpdate": True
          }

          os.makedirs('.versions', exist_ok=True)
          with open('.versions/update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          with open('.versions/version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(f"Generated legacy version JSONs for v{version_name} ({version_code})")
          EOF

      - name: Commit and Push Release Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .versions/update.json .versions/version.json
          
          if git diff-index --quiet HEAD --; then
            echo "No version metadata updates to commit."
          else
            git commit -m "Automated build & release: update version metadata [skip ci]"
            git push origin main
          fi
