name: Build and Release WebApk

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '.versions/version.json'
      - '.build-outputs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Auto-Update Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Setup Keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ -s "debug.keystore.base64" ]; then
            python3 -c '
          import base64
          with open("debug.keystore.base64", "rb") as f:
              data = f.read().replace(b"\n", b"").replace(b"\r", b"").replace(b" ", b"")
              with open("debug.keystore", "wb") as out:
                  out.write(base64.b64decode(data))
          ' || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            echo "Generating fresh standard Android debug.keystore with keytool..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Successfully verified debug.keystore readiness."

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dorg.gradle.parallel=true -Dorg.gradle.vfs.watch=false"
        run: gradle :app:assembleRelease -x test --build-cache --parallel

      - name: Verify Build Outputs
        run: |
          if [ -f ".build-outputs/app-release.apk" ]; then
            echo "Successfully verified APK generation at .build-outputs/app-release.apk"
            ls -lh .build-outputs/app-release.apk
          else
            echo "::error::Release APK not found in .build-outputs/ directory!"
            exit 1
          fi

      - name: Auto-Synchronize Version JSON
        shell: python
        run: |
          import re
          import json
          import subprocess
          import os

          # 1. Read app/build.gradle.kts
          gradle_path = 'app/build.gradle.kts'
          if not os.path.exists(gradle_path):
              print(f"Error: Gradle file not found at {gradle_path}")
              exit(1)

          with open(gradle_path, 'r', encoding='utf-8') as f:
              gradle_content = f.read()

          # Locate versionCode and versionName
          version_code_match = re.search(r'versionCode\s*=\s*([0-9]+)', gradle_content)
          version_name_match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_content)

          if not version_code_match or not version_name_match:
              print("Error: Could not extract versionCode or versionName from build.gradle.kts")
              exit(1)

          version_code = int(version_code_match.group(1))
          version_name = version_name_match.group(1)
          print(f"Extracted values from build.gradle.kts -> Code: {version_code}, Name: {version_name}")

          # 2. Read existing update.json or version.json or create if missing
          version_json_path = '.versions/update.json'
          data = {}
          if os.path.exists(version_json_path):
              with open(version_json_path, 'r', encoding='utf-8') as f:
                  try:
                      data = json.load(f)
                  except Exception as e:
                      pass
          elif os.path.exists('.versions/version.json'):
              with open('.versions/version.json', 'r', encoding='utf-8') as f:
                  try:
                      data = json.load(f)
                  except Exception as e:
                      pass
          
          # 3. Pull or format a strictly user-friendly changeLog
          try:
              commit_msg = subprocess.check_output(['git', 'log', '-1', '--pretty=%B']).decode('utf-8').strip()
              # Filter out developer/CI/internal technical terms so users only see end-user benefits
              tech_terms = ['ci', 'workflow', 'action', 'keystore', 'base64', 'gradle', 'build', 'commit', 'git', 'agent', 'keepversion', 'merge']
              if any(term in commit_msg.lower() for term in tech_terms) or len(commit_msg) < 5:
                  commit_msg = "Faster in-app downloads with instant connection, smoother performance, and stability enhancements."
          except Exception as e:
              commit_msg = "Faster in-app downloads with instant connection, smoother performance, and stability enhancements."

          # 4. Update the JSON fields
          data['versionCode'] = version_code
          data['versionName'] = version_name
          data['changeLog'] = commit_msg
          data['apkUrl'] = f"https://github.com/RahulExe69/Rock-Boys-WebApk/releases/download/v{version_name}/app-release.apk"
          if 'forceUpdate' not in data:
              data['forceUpdate'] = True

          # 5. Format and write out
          os.makedirs(os.path.dirname(version_json_path), exist_ok=True)
          with open(version_json_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          
          # Also sync backup version.json
          backup_path = '.versions/version.json'
          with open(backup_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              
          print(f"Successfully synchronized {version_json_path} and {backup_path} to version {version_name} ({version_code})")

      - name: Commit and Push Release Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .versions/update.json .versions/version.json
          
          # Check if there are changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No version metadata updates to commit."
          else
            git commit -m "Automated build & release: update version metadata to v$(python -c "import json; print(json.load(open('.versions/update.json'))['versionName'])") [skip ci]"
            git push origin main
          fi

      - name: Publish High-Speed GitHub Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(python -c "import json; print(json.load(open('.versions/update.json'))['versionName'])")
          TAG="v${VERSION_NAME}"
          echo "Publishing automated GitHub Release for $TAG..."

          # Remove existing release/tag with same name if workflow was re-run
          gh release delete "$TAG" --yes --cleanup-tag || true

          # Create release and upload APK as primary asset with latest tag
          gh release create "$TAG" .build-outputs/app-release.apk \
            --title "Rock Boys App v${VERSION_NAME}" \
            --notes "Automated build and release for Rock Boys v${VERSION_NAME}. High-speed edge CDN asset." \
            --latest
